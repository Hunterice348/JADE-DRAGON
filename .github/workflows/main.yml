
name: JADE DRAGON CI

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jade-dragon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config git \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev \
            libxcursor-dev libxinerama-dev \
            libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 and Standalone
        run: |
          cmake --build build --config Release --parallel --target JADE_DRAGON_VST3 JADE_DRAGON_Standalone

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: JADE-DRAGON-VST3-${{ runner.os }}
          path: build/JADE_DRAGON_artefacts/Release/VST3/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: JADE-DRAGON-Standalone-${{ runner.os }}
          path: build/JADE_DRAGON_artefacts/Release/Standalone/
          if-no-files-found: warn
          retention-days: 14
